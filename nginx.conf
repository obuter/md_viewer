# md_viewer — static files only. Documents never reach the server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain text/markdown application/javascript image/svg+xml;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/markdown application/javascript image/svg+xml;

    # Browsers revalidate every file (cheap 304s on the LAN), so a deploy shows up at once.
    expires -1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # Scripts only from this server; documents may show images from anywhere.
    # 'unsafe-inline' styles are needed for KaTeX and Mermaid output.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.md$ {
        default_type text/markdown;
    }
}
